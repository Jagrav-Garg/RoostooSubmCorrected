[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roostoo-sentinel"
version = "0.1.0"
description = "Selective, cost-aware, auditable Roostoo competition bot"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "pandas>=2.1,<4"]

[tool.setuptools.packages.find]
include = ["sentinel*"]
